name: Build FreeBSD Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-freebsd:
    name: Build FreeBSD release package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      GO_VERSION: '1.26'
      NODE_VERSION: '24'
      PNPM_VERSION: '10.30.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: |
          pnpm build:ssr
          cp -R build build-ssr
          pnpm build:spa
          cp -R build/spa build-spa
          rm -rf build
          mv build-ssr build
          mv build-spa build/spa

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Build FreeBSD binary (${{ matrix.arch }})
        env:
          GOOS: freebsd
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bbs-go-freebsd-${{ matrix.arch }}
          go build -v -trimpath -ldflags="-s -w" -o bbs-go-freebsd-${{ matrix.arch }}/bbs-go ./main.go

      - name: Prepare release package
        id: package
        run: |
          PKG_DIR="bbs-go-freebsd-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR"/{data,logs,res/uploads,defaults}

          cp -r locales "$PKG_DIR/"
          cp -r res "$PKG_DIR/"
          cp -r web/build "$PKG_DIR/build"
          cp docker/bbs-go-docker.yaml "$PKG_DIR/defaults/bbs-go.yaml"
          cp docker/entrypoint.sh "$PKG_DIR/"

          ln -s data/bbs-go.yaml "$PKG_DIR/bbs-go.yaml" || true

          tar -czf "bbs-go-freebsd-${{ matrix.arch }}.tar.gz" -C "$PKG_DIR" .
          echo "artifact=bbs-go-freebsd-${{ matrix.arch }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbs-go-freebsd-${{ matrix.arch }}
          path: ${{ steps.package.outputs.artifact }}

  release:
    name: Release to GitHub
    needs: build-freebsd
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
